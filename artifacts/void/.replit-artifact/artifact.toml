kind = "web"
previewPath = "/"
title = "VOID"
description = "A launch website for VOID, a reversible autonomy layer for AI agents. It explains the product, demonstrates cross-system replay, documents the technical model, and captures private beta access requests."
version = "1.0.0"
id = "artifacts/void"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18944

[services.development]
run = "pnpm --filter @workspace/void run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/void", "run", "build" ]
serve = "static"
publicDir = "artifacts/void/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18944"
BASE_PATH = "/"
