<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0v14" fill="none" stroke="#17150f" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#faf7f0"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- The frame and its crosshairs, the same spec sheet furniture as the site -->
  <rect x="60.5" y="40.5" width="1079" height="549" fill="none" stroke="#d3cab6"/>
  <g fill="#6f6857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">
    <text x="60" y="46">+</text><text x="1140" y="46">+</text>
    <text x="60" y="595">+</text><text x="1140" y="595">+</text>
  </g>

  <text x="110" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" letter-spacing="9" fill="#17150f" font-weight="700">VOID</text>
  <text x="110" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4" fill="#c44608">PRIVATE BETA</text>
  <text x="286" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4" fill="#6f6857">· REVERSIBLE AUTONOMY LAYER</text>

  <text x="110" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="78" fill="#17150f">Every action your agents</text>
  <text x="110" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="78" fill="#17150f">take, <tspan fill="#c44608">reversible</tspan>.</text>

  <text x="110" y="414" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#3d382c">Ctrl+Z for autonomous systems. Intercept, classify, compensate, replay.</text>

  <line x1="110" y1="452" x2="1090" y2="452" stroke="#e6e0d2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="2">
    <g transform="translate(110 486)">
      <rect width="10" height="22" fill="#1a7f5a"/>
      <text x="24" y="17" fill="#3d382c">R0 undo</text>
    </g>
    <g transform="translate(300 486)">
      <rect width="10" height="22" fill="#2f5fd0"/>
      <text x="24" y="17" fill="#3d382c">R1 with trace</text>
    </g>
    <g transform="translate(540 486)">
      <rect width="10" height="22" fill="#8a6d0a"/>
      <text x="24" y="17" fill="#3d382c">R2 mitigate</text>
    </g>
    <g transform="translate(770 486)">
      <rect width="10" height="22" fill="#b3122a"/>
      <text x="24" y="17" fill="#3d382c">R3 budgeted</text>
    </g>
  </g>

  <text x="110" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6f6857">void.systems  ·  product concept, illustrative numbers</text>
</svg>
