  <text x="84" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="80" fill="#0b0e1a">Every action your agents</text>
  <text x="84" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="80" fill="#3a55f5">take, reversible.</text>

  <text x="84" y="416" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#5b6379">Ctrl+Z for autonomous systems. Intercept, classify, compensate, replay.</text>

