    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d67f5"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0%" stop-color="#3a55f5" stop-opacity="0.42"/>
