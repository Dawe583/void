  <text x="84" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="80" fill="#e7ecf7">Every action your agents</text>
  <text x="84" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="80" fill="#93a5ff">take, reversible.</text>

  <text x="84" y="416" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#b9c2d6">Ctrl+Z for autonomous systems. Intercept, classify, compensate, replay.</text>

