            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Any",
            "url": "https://void.systems/",
            "publisher": { "@id": "https://void.systems/#org" },
            "description": "An interception layer between AI agents and the tools they can change. It classifies reversibility before a call, synthesises compensating actions, and keeps a signed, hash chained ledger you can replay.",

              { "@type": "Offer", "name": "Dev", "price": "0", "priceCurrency": "EUR" },

            ]

          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What happens when an action genuinely cannot be undone?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "It is classified R3 before the call, not after. VOID requires the policy to allow it, spends from the agent daily irreversibility budget, captures an evidence bundle including the approver identity, and marks the ledger entry as terminal."
                }
              },
              {
                "@type": "Question",
                "name": "Does VOID slow my agents down?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Preflight adds 8 to 40ms depending on how many systems the call touches. Commits are not blocked unless your policy says hold or veto, and read only calls skip the pipeline entirely."
                }
              },
              {
                "@type": "Question",
                "name": "Do you see my payloads?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "In self hosted mode nothing leaves your infrastructure. In managed mode you configure field level redaction before anything enters the ledger, and the signing keys stay in your KMS."
                }
              },
              {
                "@type": "Question",
                "name": "Can I run it in shadow mode first?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Shadow mode is the recommended first week. It records intent, computes classes and builds compensation plans without holding anything."
                }
              }
            ]
          }
        ]
      }

    <style>
      /* Painted before the bundle arrives so the first frame is never white. */
      html { background: #05070d; }
      html[data-theme="light"] { background: #f6f7fb; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 500 12px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
        letter-spacing: 0.34em;
        color: #6e86ff;
        background: #05070d;
      }
      html[data-theme="light"] #boot { background: #f6f7fb; color: #3a55f5; }
      #boot span { animation: bootpulse 1.2s ease-in-out infinite; }
      @keyframes bootpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @media (prefers-reduced-motion: reduce) { #boot span { animation: none; } }
    </style>
    <script>
      // Apply the stored theme before first paint so there is no flash.
      (function () {
        try {
          var stored = localStorage.getItem("void-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          /* private mode blocks storage, the default attribute stands */
        }
      })();
    </script>
