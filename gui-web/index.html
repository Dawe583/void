<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOID Workbench (web preview)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="global-nav" aria-label="Global">
  <span class="brand">VOID</span>
  <a class="hide-m" href="#/overview">Workbench</a>
  <a class="hide-m" href="#/ledger">Ledger</a>
  <a class="hide-m" href="#/registry">Registry</a>
  <a class="hide-m" href="#/policy">Policy</a>
  <span class="spacer"></span>
  <span class="conn"><span class="conn-dot" aria-hidden="true"></span><span class="small">proxy connected</span></span>
  <a href="#/holds" class="btn-dark" style="text-decoration:none">Review holds</a>
</nav>
<div class="sub-nav">
  <span class="session">sess-demo-01</span>
  <span class="muted small">illustrative fixture, nothing live</span>
  <span class="spacer"></span>
  <a href="#/live" class="btn-primary btn-small" style="text-decoration:none">Open live feed</a>
</div>
<div class="view-tabs" role="tablist" aria-label="Views">
  <button data-view="overview" role="tab">Overview</button>
  <button data-view="live" role="tab">Live feed</button>
  <button data-view="holds" role="tab">Holds</button>
  <button data-view="ledger" role="tab">Ledger</button>
  <button data-view="registry" role="tab">Registry</button>
  <button data-view="policy" role="tab">Policy</button>
  <button data-view="replay" role="tab">Replay</button>
</div>
<main id="view-root"></main>
<div id="toast-root" aria-live="polite"></div>
<div class="status-bar">
  <span id="status-ledger">ledger height 8</span>
  <span id="status-chain">chain verify OK (mock)</span>
  <span>all data illustrative</span>
</div>
<script src="fixtures.js"></script>
<script src="views/overview.js"></script>
<script src="views/live.js"></script>
<script src="views/holds.js"></script>
<script src="views/ledger.js"></script>
<script src="views/registry.js"></script>
<script src="views/policy.js"></script>
<script src="views/replay.js"></script>
<script src="app.js"></script>
</body>
</html>
