<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOID Workbench (web preview)</title>
<meta name="theme-color" content="#0d0c09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230d0c09'/%3E%3Crect x='14' y='14' width='36' height='36' fill='none' stroke='%23f0eade' stroke-width='5'/%3E%3Crect x='24' y='24' width='16' height='16' fill='none' stroke='%23e8702c' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23e8702c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>
<div id="boot" role="status" aria-label="Loading VOID workbench"><div class="boot-box"><pre id="boot-lines">VOID WORKBENCH
click anywhere to enter</pre></div></div>
<nav class="global-nav" aria-label="Global">
  <button id="side-toggle" class="nav-icon-btn" aria-label="Toggle sidebar">☰</button>
  <svg class="aperture-mark" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="vertical-align:-3px">
    <rect x="1.5" y="1.5" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <rect x="5.5" y="5.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="9" cy="9" r="1.2" fill="currentColor"/>
  </svg>
  <span class="brand">VOID</span>
  <a class="hide-m" href="#/chat">Chat</a>
  <a class="hide-m" href="#/holds">Holds</a>
  <a class="hide-m" href="#/ledger">Ledger</a>
  <span class="spacer"></span>
  <span class="conn"><span class="conn-dot" id="conn-dot" aria-hidden="true"></span><span class="small" id="conn-label">no key</span></span>
  <button id="theme-toggle" class="nav-icon-btn" aria-label="Theme">Theme</button>
  <button id="palette-open" class="nav-icon-btn" aria-label="Command palette">⌘K</button>
  <a href="#/holds" class="btn-dark" style="text-decoration:none">Review holds</a>
</nav>
<div class="sub-nav">
  <span class="session">sess-demo-01</span>
  <span class="muted small">illustrative fixture, nothing live</span>
  <span class="spacer"></span>
  <a href="#/chat" class="btn-primary btn-small" style="text-decoration:none">Open chat</a>
</div>
<div class="layout">
<aside id="sidebar" aria-label="Views">
  <button class="btn-primary btn-small side-new" id="side-new">New chat</button>
  <input id="side-search" type="text" placeholder="Search chats" aria-label="Search chats">
  <div id="side-chats"></div>
  <div class="side-group"><div class="side-title">Operate</div><div id="nav-workbench"></div></div>
  <div class="side-group"><div class="side-title">Observe</div><div id="nav-govern"></div></div>
  <div class="side-group"><div class="side-title">Setup</div><div id="nav-setup"></div></div>
  <div class="side-foot muted small">? shortcuts<br>Cmd K palette<br>Cmd N new chat</div>
</aside>
<main id="view-root"></main>
</div>
<div id="palette" class="palette" hidden>
  <input id="palette-input" type="text" placeholder="Jump to a view or action (Esc closes)" aria-label="Jump to a view">
  <div id="palette-list"></div>
</div>
<div id="toast-root" aria-live="polite"></div>
<div class="status-bar">
  <span id="status-ledger">ledger height 0</span>
  <span id="status-chain">chain not verified</span>
  <span id="status-model">model n/a</span>
  <span>all data illustrative except chat</span>
</div>
<script src="fixtures.js"></script>
<script src="js/api.js"></script>
<script src="views/overview.js"></script>
<script src="views/chat.js"></script>
<script src="views/intercept.js"></script>
<script src="views/live.js"></script>
<script src="views/holds.js"></script>
<script src="views/ledger.js"></script>
<script src="views/registry.js"></script>
<script src="views/policy.js"></script>
<script src="views/providers.js"></script>
<script src="views/models.js"></script>
<script src="views/replay.js"></script>
<script src="views/sessions.js"></script>
<script src="views/connectors.js"></script>
<script src="views/facts.js"></script>
<script src="views/taint.js"></script>
<script src="views/audit.js"></script>
<script src="views/cli.js"></script>
<script src="views/github.js"></script>
<script src="views/settings.js"></script>
<script src="views/shortcuts.js"></script>
<script src="views/artifacts.js"></script>
<script src="app.js"></script>
</body>
</html>
